aid: aora
name: Aora
description: >-
  Aora (Aora Servicios) is a Mexico-based on-demand home and office services
  marketplace that connects households and businesses with vetted technicians
  and providers for repairs, installations, and maintenance. Its catalog spans
  home and office repairs, white-goods and appliance service, air conditioning
  and mini-split installation, water heaters, plumbing and drainage,
  waterproofing, and home-technology work. Consumers browse and book services
  through the Aora web app and the Aora mobile app, while a B2B program serves
  business customers. The company is backed by 500 Global. Aora publishes a
  consumer-facing website and blog but does not currently expose a public
  developer portal, API documentation, or SDKs; this profile captures its
  public web surface and domain-security posture.
